<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import Explore from '/src/analysis/Explore.tsx';
import {getAnalysisWasmConnection} from '/src/lib/duckdbWasm.ts';
const conn=await getAnalysisWasmConnection();
await conn.query(`CREATE TABLE dashboard_source AS SELECT i::INTEGER AS id,
 ['Москва','Казань','Пермь'][1+i%3] AS region,
 DATE '2025-01-01'+(i%30)::INTEGER AS day,
 (i%100)/10.0 AS amount, (1+i%8)::INTEGER AS quantity FROM range(12000) t(i)`);
createRoot(document.getElementById('root')).render(React.createElement(Explore,{source:{database:'memory',schema:'main',table:'dashboard_source',connection:':memory:'}}));
</script></body></html>
