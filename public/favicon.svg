<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Strict, Orthogonal Report/Excel Icon (Bottom Left) -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <g stroke="#475569" stroke-width="18">
      <!-- Document outline with folded corner -->
      <path d="M 84 283 L 172 283 L 216 327 L 216 459 L 84 459 Z"/>
      <path d="M 172 283 L 172 327 L 216 327"/>
      <!-- Standard data row -->
      <line x1="112" y1="415" x2="189" y2="415"/>
    </g>
    <!-- Emerald Excel accent row -->
    <line x1="112" y1="366" x2="189" y2="366" stroke="#10b981" stroke-width="18"/>
  </g>
  
  <!-- Centered, Symmetric AST Graph Edges -->
  <path d="M 256 96 L 157 239 M 256 96 L 355 239" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
  
  <!-- AST Graph Nodes -->
  <circle cx="256" cy="96" r="22" fill="url(#lensGrad)"/>
  <circle cx="157" cy="239" r="22" fill="url(#lensGrad)"/>
  <circle cx="355" cy="239" r="22" fill="url(#lensGrad)"/>
  
  <!-- Glowing Magnifying Lens Circle -->
  <circle cx="256" cy="195" r="132" fill="none" stroke="url(#lensGrad)" stroke-width="36" filter="url(#glow)"/>
  
  <!-- Lens Handle (No Glow) -->
  <line x1="350" y1="289" x2="458" y2="398" stroke="url(#lensGrad)" stroke-width="44" stroke-linecap="round"/>
</svg>
