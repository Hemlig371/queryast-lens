<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer AST Connections / Edges -->
  <path d="M 160 360 L 256 160 L 352 360 M 256 160 L 256 360" stroke="#475569" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Nodes -->
  <circle cx="256" cy="160" r="28" fill="url(#lensGrad)" filter="url(#glow)"/>
  <circle cx="160" cy="360" r="22" fill="#38bdf8"/>
  <circle cx="256" cy="360" r="22" fill="#38bdf8"/>
  <circle cx="352" cy="360" r="22" fill="#38bdf8"/>
  
  <!-- Magnifying Lens Ring -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="url(#lensGrad)" stroke-width="24" filter="url(#glow)"/>
  <line x1="334" y1="318" x2="420" y2="404" stroke="url(#lensGrad)" stroke-width="28" stroke-linecap="round"/>

  <!-- Lens reflection -->
  <path d="M 180 180 A 80 80 0 0 1 310 180" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.4"/>
</svg>
