name: Build Applications (Desktop & Android)

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer command prompt
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          echo "Preparing Windows build environment..."

      - name: Install web app dependencies
        shell: bash
        run: |
          rm -rf package-lock.json bun.lock bun.lockb node_modules
          npm install

      - name: Build web application
        run: npm run build

      - name: Generate Desktop Icons
        run: node generate-icons.js

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "QueryAST Lens v__VERSION__"
          releaseBody: "Draft release of QueryAST Lens desktop and mobile applications."
          releaseDraft: true
          prerelease: false

  build-android-apk:
    needs: build-tauri
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Clean and Install dependencies
        shell: bash
        run: |
          rm -rf package-lock.json bun.lock bun.lockb node_modules
          npm install

      - name: Build web application
        run: npm run build

      - name: Add Android Platform & Sync Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Release Asset
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/app-debug.apk QueryAST-Lens-v${VERSION}-android.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: QueryAST-Lens-*-android.apk
          draft: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueryAST-Lens-Android-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
