name: Build Desktop Application (Tauri)

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 'large'
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer command prompt
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Enable long paths on Windows
        if: matrix.platform == 'windows-latest'
        run: |
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1
          git config --global core.longpaths true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          echo "Preparing Windows build environment..."

      - name: Install web app dependencies
        shell: bash
        run: |
          rm -rf package-lock.json bun.lock bun.lockb node_modules
          npm install

      - name: Build web application
        run: npm run build

      - name: Generate Desktop Icons
        run: node generate-icons.js

      - name: Update Cargo dependencies
        run: cargo update --manifest-path src-tauri/Cargo.toml

      - name: Set Cargo Target Dir for Windows
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:\t" >> $GITHUB_ENV

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          CARGO_BUILD_JOBS: 2
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # This will be automatically replaced with the version in tauri.conf.json
          releaseName: "QueryAST Lens v__VERSION__"
          releaseBody: "Draft release of QueryAST Lens desktop application."
          releaseDraft: true
          prerelease: false
