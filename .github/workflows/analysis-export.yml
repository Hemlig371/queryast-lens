name: Analysis export compatibility
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/analysis/**', 'scripts/build-analysis-export.mjs', 'scripts/patch-perspective-duckdb.mjs', 'scripts/patch-perspective-number-locale.mjs', 'tests/analysis/**', 'tests/browser/analysis-export*', 'tests/verifyArrowCompression.py', 'package*.json', '.github/workflows/analysis-export.yml']
  push:
    paths: ['src/analysis/**', 'scripts/build-analysis-export.mjs', 'scripts/patch-perspective-duckdb.mjs', 'scripts/patch-perspective-number-locale.mjs', 'tests/analysis/**', 'tests/browser/analysis-export*', 'tests/verifyArrowCompression.py', 'package*.json', '.github/workflows/analysis-export.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Configure export test directories
        run: |
          echo "LENS_COMPRESSION_FIXTURES_DIR=$RUNNER_TEMP/lens-compression" >> "$GITHUB_ENV"
          echo "ANALYSIS_EXPORT_RESULTS=$RUNNER_TEMP/lens-dashboard" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/lens-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: npm run lint
      - name: Export codecs, files and renderer locale regressions
        run: |
          npm run build:analysis-export
          node --import tsx --test tests/analysis/analysis-compression.check.ts tests/analysis/analysis-export*.check.ts tests/analysis/analysis-htmlReplay.check.ts tests/analysis/analysis-numberLocale.check.ts
      - run: python -m pip install pyarrow==26.0.1
      - run: python tests/verifyArrowCompression.py
      - run: npm run build
      - name: Install browser test tools outside project dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/lens-browser" playwright@1.62.0
          node "$RUNNER_TEMP/lens-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify HTML restore and chart PNG exports
        run: |
          npm run dev > "$RUNNER_TEMP/lens-vite.log" 2>&1 &
          server_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Dev server log:"
              tail -n 120 "$RUNNER_TEMP/lens-vite.log" || true
            fi
            kill "$server_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/tests/browser/analysis-export.html > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:3000/tests/browser/analysis-export.html > /dev/null; then
            echo "Browser fixture is not available"
            exit 1
          fi
          node tests/browser/analysis-export.mjs
      - name: Preserve export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-export-diagnostics
          path: ${{ env.ANALYSIS_EXPORT_RESULTS }}
          if-no-files-found: ignore
