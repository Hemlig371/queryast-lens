name: Analysis native Arrow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-analysis-export.mjs'
      - 'scripts/patch-perspective-duckdb.mjs'
      - 'src/analysis/**'
      - 'src-tauri/**'
      - 'tests/analysis/**'
      - 'tests/analysisNativeArrow.mjs'
      - 'tests/viewSql.integration.mjs'
      - 'package*.json'
      - '.npmrc'
      - '.github/workflows/analysis-native.yml'
  push:
    paths:
      - 'scripts/build-analysis-export.mjs'
      - 'scripts/patch-perspective-duckdb.mjs'
      - 'src/analysis/**'
      - 'src-tauri/**'
      - 'tests/analysis/**'
      - 'tests/analysisNativeArrow.mjs'
      - 'tests/viewSql.integration.mjs'
      - 'package*.json'
      - '.npmrc'
      - '.github/workflows/analysis-native.yml'

permissions:
  contents: read

jobs:
  native-arrow:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Configure native fixture directory
        run: echo "LENS_ARROW_FIXTURE_DIR=$RUNNER_TEMP/lens-arrow" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Install Tauri 1 Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run lint
      - run: npm run test:analysis
      - name: Generate replay SQL and expected Arrow from the pinned Virtual Server
        run: npm run test:analysis-sql
      - name: Prepare development icons
        run: node generate-icons.js
      - name: Compile Tauri and test the actual native transport (no release build)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features analysis::tests -- --nocapture
      - name: Decode Rust IPC with Lens JavaScript Arrow and compare replay results
        run: node tests/analysisNativeArrow.mjs


