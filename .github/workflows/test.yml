name: Tests

on:
  push:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies from lock file
        run: npm ci --include=dev --include=optional

      - name: Lint (type check)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npx vitest run --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results.xml

      - name: Analysis unit tests (node:test)
        run: |
          npm run build:analysis-export
          node --import tsx --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results-analysis.xml tests/analysis/*.check.ts

      - name: Analysis SQL replay integration
        id: analysis_sql
        run: npm run test:analysis-sql

      - name: Test summary
        if: always()
        env:
          ANALYSIS_SQL_OUTCOME: ${{ steps.analysis_sql.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          lines = ['### Тесты', '', '| Набор | Успешно | Ошибки | Пропущено |', '| --- | ---: | ---: | ---: |']
          totals = [0, 0, 0]
          for name, filename in [('Vitest', 'test-results.xml'), ('Analysis node:test', 'test-results-analysis.xml')]:
              path = Path(filename)
              if not path.exists():
                  lines.append(f'| {name} | Отчёт не создан | — | — |')
                  continue
              cases = list(ET.parse(path).getroot().iter('testcase'))
              failures = sum(c.find('failure') is not None or c.find('error') is not None for c in cases)
              skipped = sum(c.find('skipped') is not None for c in cases)
              passed = len(cases) - failures - skipped
              lines.append(f'| {name} | {passed} | {failures} | {skipped} |')
              totals = [x + y for x, y in zip(totals, [passed, failures, skipped])]
          lines.append(f'| **Всего unit** | **{totals[0]}** | **{totals[1]}** | **{totals[2]}** |')
          lines.extend(['', 'SQL replay: ' + os.environ.get('ANALYSIS_SQL_OUTCOME', 'unknown')])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write('\n'.join(lines) + '\n')
          PY
