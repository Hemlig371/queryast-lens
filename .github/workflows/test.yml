name: Tests

on:
  push:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          rm -rf package-lock.json bun.lock bun.lockb node_modules
          npm install

      - name: Lint (type check)
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=test-results.xml

      - name: Test summary
        if: always()
        run: |
          node -e "
          const x=require('fs').readFileSync('test-results.xml','utf8');
          const m=x.match(/<testsuites[^>]*>/)[0];
          const g=k=>(m.match(new RegExp(k+'=\"(\\\\d+)\"'))||[0,0])[1];
          const t=g('tests'),f=g('failures'),e=g('errors');
          console.log(\`### Тесты\n\n✅: \${t-f-e}\n❌: \${f+ +e}\n\nAll: \${t}\`);
          " >> "$GITHUB_STEP_SUMMARY"
